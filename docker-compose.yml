version: '3.9'

services:
  db:
    image: postgres:14
    container_name: smartbudget-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: evinda123
      POSTGRES_DB: smartbudget_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: smartbudget-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:evinda123@db:5432/smartbudget_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbudget-frontend
    ports:
      - "4000:80"
    depends_on:
      - backend

volumes:
  postgres_data: